[project]
name = "network-echos"
version = "0.1.0"
authors = [
  {name = "Garland Culbreth", email = "culbreth.garland@gmail.com"}]
maintainers = [
  {name = "Garland Culbreth", email = "culbreth.garland@gmail.com"}]
dependencies = [
  "numpy>=2.1.0",
  "networkx>=3.3",
  "polars>=1.5.0",
  "matplotlib>=3.9.2",
  "seaborn>=0.13.2",
  "pytest>=8.3.2",
  "ruff>=0.6.2",
  "mkdocs-material>=9.5.33",
  "mkdocstrings[python]>=0.25.2",
  "rich>=13.9.4",
  "pandas>2.2.2",
  "pre-commit>=4.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netechos"]

[tool.ruff.lint]
select = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["D104"]
"tests/*.py" = ["S101"]
